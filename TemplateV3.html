<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Maker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Quill Rich Text Editor CSS -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="bg-white rounded-xl shadow-md p-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Template Maker Tool</h1>
                <p class="text-sm text-slate-500">by KKT</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                <!-- Gemini Model Selector (gemini-3.5-flash-lite ထည့်သွင်းထားသည်) -->
                <div class="flex flex-col">
                    <label class="text-xs text-slate-500 mb-1">Gemini Model</label>
                    <select id="modelSelector" onchange="saveSelectedModel()" class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                        <option value="gemini-3.7-flash">gemini-3.7-flash</option>
                        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
                        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
                    </select>
                </div>

                <!-- API Key Section -->
                <div class="flex flex-col">
                    <label class="text-xs text-slate-500 mb-1">API Key</label>
                    <div class="flex items-center gap-2">
                        <input type="password" id="apiKey" placeholder="API Key ထည့်ရန်" 
                            class="px-3 py-2 border rounded-lg text-sm w-48 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="saveApiKey()" class="bg-slate-800 text-white px-3.5 py-2 rounded-lg text-sm hover:bg-slate-700 transition">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Workspace Layout (Grid 3 Columns: Left Sidebar for Saved Templates, Middle for Inputs, Right for Output) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 1. SAVED TEMPLATE LIST (ဘယ်ဘက်အစွန်ဆုံး ဒေါင်လိုက်စာရင်း) -->
            <div class="lg:col-span-3 bg-white rounded-xl shadow-md p-4 flex flex-col space-y-4 h-fit">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="font-semibold text-slate-800 text-sm">📁 Saved Templates</h2>
                    <button onclick="openTemplateModal()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-2 py-1 rounded transition">
                        + Save Current
                    </button>
                </div>
                <!-- Vertical List Container -->
                <div id="templateListContainer" class="flex flex-col space-y-2 max-h-[500px] overflow-y-auto pr-1">
                    <span class="text-xs text-slate-400 italic">သိမ်းထားသော Template မရှိသေးပါ။</span>
                </div>
            </div>

            <!-- 2. MIDDLE COLUMN: Inputs & Confirm Button (full alert info & example format) -->
            <div class="lg:col-span-4 bg-white rounded-xl shadow-md p-6 flex flex-col space-y-6">
                
                <!-- Full Alert Info Input -->
                <div class="flex flex-col space-y-2">
                    <label class="font-semibold text-slate-700 text-sm">Full Alert Info</label>
                    <textarea id="fullAlertInfo" rows="8" placeholder="Full alert info..."
                        class="w-full p-3 border rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Example Template Format Input -->
                <div class="flex flex-col space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="font-semibold text-slate-700 text-sm">Example Template Format</label>
                        <button onclick="deleteCurrentTemplate()" class="text-xs text-red-600 hover:text-red-800">🗑️ Clear</button>
                    </div>
                    <textarea id="templateFormat" rows="8" placeholder=" Template..."
                        class="w-full p-3 border rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Confirm Button -->
                <button onclick="generateOutput()" id="confirmBtn"
                    class="bg-blue-600 text-white font-semibold px-8 py-3 rounded-lg shadow hover:bg-blue-700 transition w-full text-center">
                    Generate Output
                </button>
            </div>

            <!-- 3. RIGHT COLUMN: Large Output Text Box (Word-like Editor) -->
            <div class="lg:col-span-5 bg-white rounded-xl shadow-md p-6 flex flex-col space-y-3">
                <div class="flex justify-between items-center">
                    <label class="font-semibold text-slate-700 text-sm">Output Result (Editable & Copyable)</label>
                    <button onclick="copyOutput()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-3 py-1.5 rounded transition flex items-center gap-1">
                        📋 Copy Output
                    </button>
                </div>
                
                <!-- Quill Rich Text Editor Container (ကြီးမားသော ညာဘက်အကွက်) -->
                <div id="editor-container" class="bg-white rounded-b-lg min-h-[580px] text-sm font-mono border"></div>
            </div>

        </div>

    </div>

    <!-- Quill Rich Text Editor JS -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

    <!-- JavaScript Logic -->
    <script>
        // Initialize Quill Editor
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ header: [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ color: [] }, { background: [] }],
                    [{ list: 'ordered' }, { list: 'bullet' }],
                    ['clean']
                ]
            },
            placeholder: 'Here is output...'
        });

        // Page load လုပ်ချိန်တွင် သိမ်းထားသော အချက်အလက်များ ဖော်ပြရန်
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }

            const savedModel = localStorage.getItem('gemini_selected_model');
            if (savedModel) {
                document.getElementById('modelSelector').value = savedModel;
            }

            renderTemplateList();
        }

        // API Key သိမ်းရန်
        function saveApiKey() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (apiKey) {
                localStorage.setItem('gemini_api_key', apiKey);
                alert('API Key successfully saved!');
            } else {
                alert('ကျေးဇူးပြု၍ API Key ထည့်ပါ။');
            }
        }

        // ရွေးချယ်ထားသော Model ကို မှတ်ထားရန်
        function saveSelectedModel() {
            const selectedModel = document.getElementById('modelSelector').value;
            localStorage.setItem('gemini_selected_model', selectedModel);
        }

        // Templates များကို localStorage မှ ရယူရန်
        function getSavedTemplates() {
            const templates = localStorage.getItem('saved_templates');
            return templates ? JSON.parse(templates) : {};
        }

        // ဘယ်ဘက်ခြမ်းတွင် Template များကို ဒေါင်လိုက် List ပုံစံဖြင့် ဖော်ပြရန်
        function renderTemplateList() {
            const container = document.getElementById('templateListContainer');
            const templates = getSavedTemplates();
            
            container.innerHTML = '';
            const keys = Object.keys(templates);

            if (keys.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-400 italic">သိမ်းထားသော Template မရှိသေးပါ။</span>';
                return;
            }

            keys.forEach(name => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex items-center justify-between p-2 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-lg transition group';
                
                // Template Name Click to Load
                const nameBtn = document.createElement('button');
                nameBtn.className = 'text-xs text-left text-slate-700 font-medium truncate flex-1 focus:outline-none';
                nameBtn.textContent = name;
                nameBtn.onclick = () => {
                    document.getElementById('templateFormat').value = templates[name];
                };

                // Delete Button for individual template
                const delBtn = document.createElement('button');
                delBtn.className = 'text-xs text-red-400 hover:text-red-600 px-1 opacity-60 group-hover:opacity-100 transition';
                delBtn.innerHTML = '✕';
                delBtn.title = 'Delete Template';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (confirm(`"${name}" Template ကို ဖျက်မှာ သေချာပါသလား?`)) {
                        delete templates[name];
                        localStorage.setItem('saved_templates', JSON.stringify(templates));
                        renderTemplateList();
                    }
                };

                itemDiv.appendChild(nameBtn);
                itemDiv.appendChild(delBtn);
                container.appendChild(itemDiv);
            });
        }

        // လက်ရှိ Template ကို နာမည်ပေးပြီး သိမ်းရန်
        function openTemplateModal() {
            const currentTemplateText = document.getElementById('templateFormat').value.trim();
            if (!currentTemplateText) {
                alert('သိမ်းဆည်းရန် Template စာသား မရှိသေးပါ။');
                return;
            }

            const templateName = prompt('ဤ Template အတွက် အမည်ပေးပါ (Template Name):');
            if (!templateName) return;

            const templates = getSavedTemplates();
            templates[templateName] = currentTemplateText;
            localStorage.setItem('saved_templates', JSON.stringify(templates));
            
            renderTemplateList();
            alert(`Template "${templateName}" အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ!`);
        }

        // Template အကွက်ကို ရှင်းလင်းရန်
        function deleteCurrentTemplate() {
            document.getElementById('templateFormat').value = '';
        }

        // Copy rich text output function
        function copyOutput() {
            const textToCopy = quill.getText();
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Output copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Gemini API ခေါ်ဆိုရန်
        async function generateOutput() {
            const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('gemini_api_key');
            const selectedModel = document.getElementById('modelSelector').value;
            const templateFormat = document.getElementById('templateFormat').value.trim();
            const fullAlertInfo = document.getElementById('fullAlertInfo').value.trim();
            const confirmBtn = document.getElementById('confirmBtn');

            if (!apiKey) {
                alert('ကျေးဇူးပြု၍ Gemini API Key အရင်ထည့်ပြီး Save ပါ။');
                return;
            }

            if (!templateFormat || !fullAlertInfo) {
                alert('Example Template Format နှင့် Full Alert Info နှစ်ခုလုံးတွင် စာထည့်ရန် လိုအပ်ပါသည်။');
                return;
            }

            const prompt = `Act as a cybersecurity documentation assistant. I will provide you with a specific template format and a raw alert log/information text. Your task is to extract the relevant data from the raw alert info and map it exactly into the provided template format. Do not add extra information or change the structure of the template. Do not fill anything in Alert ID and Alert Name. Start with just "Dear Team,". Show time zone as template time zone.

Here is the Example Template Format:
-------------------
${templateFormat}
-------------------

Here is the Full Alert Info:
---------------------
${fullAlertInfo}
---------------------
Please generate the final output based strictly on the template format above.`;

            confirmBtn.disabled = true;
            confirmBtn.innerText = 'Generating...';
            quill.setText('Generating Output...');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                const data = await response.json();

                if (response.ok && data.candidates && data.candidates.length > 0) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    quill.setText(aiResponse);
                } else {
                    quill.setText('Error: ' + (data.error ? data.error.message : 'Unknown error occurred.'));
                }
            } catch (error) {
                console.error('Error:', error);
                quill.setText('Network Error သို့မဟုတ် API ခေါ်ဆိုမှု အမှားအယွင်းရှိနေပါသည်။');
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.innerText = 'Generate Output';
            }
        }
    </script>
</body>
</html>
